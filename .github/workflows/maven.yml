name: Selenium Automation Pipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  schedule:
    # Runs every day at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  automation-test:

    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Verify Java and Maven
      - name: Verify Environment
        run: |
          java -version
          mvn -version

      # Clean and Build Project
      - name: Build Project
        run: mvn clean install -DskipTests

      # Execute TestNG Suite
      - name: Execute Automation Tests
        run: mvn test -DsuiteXmlFile=Master.xml

      # Upload TestNG Reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestNG-Reports
          path: test-output/

      # Upload Screenshots if tests fail
      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Failure-Screenshots
          path: screenshots/

      # Upload Logs
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Execution-Logs
          path: logs/
