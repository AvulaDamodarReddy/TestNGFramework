name: Selenium Automation Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 2 * * *'   # daily at 2 AM UTC

jobs:
  automation-test:
    runs-on: ubuntu-latest

    steps:

      # ── SETUP: Checkout & Environment ──────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Environment
        run: |
          echo "Java Version:"
          java -version
          echo -e "\nMaven Version:"
          mvn -version
          echo -e "\nChrome Version:"
          google-chrome --version

      # ── PREPARATION ───────────────────────────────────────────────────
      - name: Create output directories
        run: mkdir -p test-output screenshots logs

      # ── BUILD & TEST ───────────────────────────────────────────────────
      - name: Build Project
        run: mvn clean install -DskipTests --no-transfer-progress

      - name: Execute Automation Tests
        run: mvn test -DsuiteXmlFile=Master.xml --no-transfer-progress
        env:
          CI: true

      # ── DEBUG: Check Test Reports ──────────────────────────────────────
      - name: Verify Test Reports Generated
        if: always()
        run: |
          echo "Checking for test reports..."
          if [ -d "target/surefire-reports" ]; then
            echo "✅ Reports directory exists"
            ls -la target/surefire-reports/
            if [ -f "target/surefire-reports/testng-results.xml" ]; then
              echo "✅ TestNG results XML found"
              head -20 target/surefire-reports/testng-results.xml
            else
              echo "⚠️  TestNG results XML not found"
            fi
          else
            echo "❌ Reports directory not found"
          fi

      # ── REPORT: Publish Test Results ───────────────────────────────────
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: TestNG Results
          path: target/surefire-reports/TEST-*.xml
          reporter: 'java-junit'
          fail-on-error: false

      # ── ARTIFACTS: Upload Results ──────────────────────────────────────
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Surefire-Reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload TestNG Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestNG-Reports
          path: test-output/
          retention-days: 14

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Failure-Screenshots
          path: screenshots/
          retention-days: 7

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Execution-Logs
          path: logs/
          retention-days: 7

      # ── NOTIFICATIONS: Slack ────────────────────────────────────────────
      - name: Notify Slack — Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *Selenium Tests Passed*",
              "attachments": [{
                "color": "good",
                "fields": [
                  { "title": "Repo",    "value": "${{ github.repository }}", "short": true },
                  { "title": "Branch",  "value": "${{ github.ref_name }}",   "short": true },
                  { "title": "Trigger", "value": "${{ github.event_name }}", "short": true },
                  { "title": "Actor",   "value": "${{ github.actor }}",      "short": true },
                  { "title": "Commit",  "value": "${{ github.event.head_commit.message }}", "short": false },
                  { "title": "Run",     "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>", "short": false }
                ]
              }]
            }
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ *Selenium Tests FAILED*",
              "attachments": [{
                "color": "danger",
                "fields": [
                  { "title": "Repo",    "value": "${{ github.repository }}", "short": true },
                  { "title": "Branch",  "value": "${{ github.ref_name }}",   "short": true },
                  { "title": "Trigger", "value": "${{ github.event_name }}", "short": true },
                  { "title": "Actor",   "value": "${{ github.actor }}",      "short": true },
                  { "title": "Commit",  "value": "${{ github.event.head_commit.message }}", "short": false },
                  { "title": "Run",     "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs 🔍>", "short": false }
                ]
              }]
            }
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
